<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page01</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page01-body">
    <div class="window">
      <div class="icons">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 4h16v16H4z" />
          <polyline points="22 6 12 13 2 6" />
        </svg>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
          />
        </svg>
      </div>
      <form>
        <div class="field-group">
          <input type="text" id="name" placeholder=" " />
          <label for="name">Nombre</label>
        </div>
        <div class="field-group">
          <input type="email" id="email" placeholder=" " />
          <label for="email">Email</label>
        </div>
        <div class="field-group">
          <input type="tel" id="phone" placeholder=" " />
          <label for="phone">Teléfono</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="terms" />
          <label for="terms">Acepto términos y condiciones</label>
        </div>
        <div class="btn-group">
          <button type="submit" class="btn-primary">Enviar</button>
          <button type="reset" class="btn-secondary">Limpiar</button>
        </div>
      </form>
      <div class="image-drop" id="dropZone">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg>
        <span>Arrastra o haz clic</span>
        <input type="file" id="fileInput" accept="image/*" />
      </div>
      <div class="file-path" id="filePath">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#888"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
        <span>Ningún archivo seleccionado</span>
      </div>
    </div>
    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const filePath = document.getElementById("filePath");
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
      });
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          updatePath(e.dataTransfer.files[0]);
        }
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) {
          updatePath(fileInput.files[0]);
        }
      });
      function updatePath(file) {
        filePath.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">' +
          '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
          '<polyline points="14 2 14 8 20 8"/>' +
          '<line x1="16" y1="13" x2="8" y2="13"/>' +
          '<line x1="16" y1="17" x2="8" y2="17"/>' +
          '<polyline points="10 9 9 9 8 9"/>' +
          "</svg>" +
          "<span>" +
          file.name +
          " (" +
          (file.size / 1024).toFixed(1) +
          " KB)</span>";
      }
    </script>
  </body>
</html>
