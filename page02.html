<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page02</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page02-body">
    <div class="container">
      <div class="icons">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          />
        </svg>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <polyline points="9 12 11 14 15 10" />
        </svg>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#2c3e50"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
      </div>
      <div class="radio-group">
        <label
          ><input type="radio" name="option" value="1" checked /> Opción
          1</label
        >
        <label><input type="radio" name="option" value="2" /> Opción 2</label>
        <label><input type="radio" name="option" value="3" /> Opción 3</label>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="tab1">Pestaña 1</button>
        <button class="tab" data-tab="tab2">Pestaña 2</button>
        <button class="tab" data-tab="tab3">Pestaña 3</button>
      </div>
      <div id="tab1" class="tab-content active">Contenido de la Pestaña 1</div>
      <div id="tab2" class="tab-content">Contenido de la Pestaña 2</div>
      <div id="tab3" class="tab-content">Contenido de la Pestaña 3</div>
    </div>
    <div class="container">
      <div class="card-rgb">
        <div
          class="color-preview"
          id="colorPreview"
          style="background: rgb(128, 128, 128)"
        ></div>
        <div class="sliders">
          <div class="slider-row">
            <label style="color: #e74c3c">R</label>
            <input
              type="range"
              min="0"
              max="255"
              value="128"
              class="rgb-slider"
              data-color="r"
            />
            <input
              type="number"
              min="0"
              max="255"
              value="128"
              class="rgb-number"
              data-color="r"
            />
          </div>
          <div class="slider-row">
            <label style="color: #2ecc71">G</label>
            <input
              type="range"
              min="0"
              max="255"
              value="128"
              class="rgb-slider"
              data-color="g"
            />
            <input
              type="number"
              min="0"
              max="255"
              value="128"
              class="rgb-number"
              data-color="g"
            />
          </div>
          <div class="slider-row">
            <label style="color: #3498db">B</label>
            <input
              type="range"
              min="0"
              max="255"
              value="128"
              class="rgb-slider"
              data-color="b"
            />
            <input
              type="number"
              min="0"
              max="255"
              value="128"
              class="rgb-number"
              data-color="b"
            />
          </div>
        </div>
      </div>
    </div>
    <script>
      const tabs = document.querySelectorAll(".tab");
      const contents = document.querySelectorAll(".tab-content");
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          contents.forEach((c) => c.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(tab.dataset.tab).classList.add("active");
        });
      });
      const sliders = document.querySelectorAll(".rgb-slider");
      const numbers = document.querySelectorAll(".rgb-number");
      const preview = document.getElementById("colorPreview");
      function updateColor() {
        let r = document.querySelector('.rgb-slider[data-color="r"]').value;
        let g = document.querySelector('.rgb-slider[data-color="g"]').value;
        let b = document.querySelector('.rgb-slider[data-color="b"]').value;
        preview.style.background = "rgb(" + r + "," + g + "," + b + ")";
        document.querySelector('.rgb-number[data-color="r"]').value = r;
        document.querySelector('.rgb-number[data-color="g"]').value = g;
        document.querySelector('.rgb-number[data-color="b"]').value = b;
      }
      sliders.forEach((slider) => {
        slider.addEventListener("input", updateColor);
      });
      numbers.forEach((num) => {
        num.addEventListener("input", function () {
          let val = Math.min(255, Math.max(0, parseInt(this.value) || 0));
          this.value = val;
          document.querySelector(
            '.rgb-slider[data-color="' + this.dataset.color + '"]',
          ).value = val;
          updateColor();
        });
      });
      updateColor();
    </script>
  </body>
</html>
