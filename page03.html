<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page03</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page03-body">
    <div class="page03-container">
      <h1>Galería Natural</h1>
      <p class="subtitle">Imágenes con efecto de opacidad al pasar el mouse</p>
      <div class="grid">
        <div class="item">
          <img src="https://picsum.photos/seed/1/400/300" alt="Imagen 1" />
          <h3>Montaña</h3>
          <p>Paisaje de montaña con nieve</p>
          <span class="tag">Naturaleza</span>
        </div>
        <div class="item">
          <img src="https://picsum.photos/seed/2/400/300" alt="Imagen 2" />
          <h3>Bosque</h3>
          <p>Bosque verde y frondoso</p>
          <span class="tag">Verde</span>
        </div>
        <div class="item">
          <img src="https://picsum.photos/seed/3/400/300" alt="Imagen 3" />
          <h3>Ocaso</h3>
          <p>Atardecer en la playa</p>
          <span class="tag">Atardecer</span>
        </div>
        <div class="item">
          <img src="https://picsum.photos/seed/4/400/300" alt="Imagen 4" />
          <h3>Ciudad</h3>
          <p>Vista nocturna urbana</p>
          <span class="tag">Urbano</span>
        </div>
      </div>
    </div>
  </body>
</html>
