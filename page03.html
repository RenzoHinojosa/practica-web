<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page03</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page03-body">
    <div class="page03-container">
      <h1>Galería Natural</h1>
      <p class="subtitle">Imágenes con efecto de opacidad al pasar el mouse</p>
      <div class="grid">
        <div class="item">
          <img
            src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&h=300&fit=crop"
            alt="Montaña"
          />
          <h3>Montaña</h3>
          <p>Paisaje de montaña con nieve</p>
          <span class="tag">Naturaleza</span>
        </div>
        <div class="item">
          <img
            src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=400&h=300&fit=crop"
            alt="Bosque"
          />
          <h3>Bosque</h3>
          <p>Bosque verde y frondoso</p>
          <span class="tag">Verde</span>
        </div>
        <div class="item">
          <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&h=300&fit=crop"
            alt="Ocaso"
          />
          <h3>Ocaso</h3>
          <p>Atardecer en la playa</p>
          <span class="tag">Atardecer</span>
        </div>
        <div class="item">
          <img
            src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=400&h=300&fit=crop"
            alt="Ciudad"
          />
          <h3>Ciudad</h3>
          <p>Vista nocturna urbana</p>
          <span class="tag">Urbano</span>
        </div>
      </div>
    </div>
  </body>
</html>
